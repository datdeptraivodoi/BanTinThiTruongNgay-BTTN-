name: BTTN checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu libgl1
          echo 'ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true' | sudo debconf-set-selections
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y ttf-mscorefonts-installer
          fc-cache -f
          test "$(fc-match -f '%{family}' 'Times New Roman')" = 'Times New Roman'
          python -m pip install -r requirements-dev.txt
          npm install
      - run: python -m ruff check .
      - run: python -m pytest -q
      - name: Render offline fixture through production pipeline
        run: python build_test_report.py
