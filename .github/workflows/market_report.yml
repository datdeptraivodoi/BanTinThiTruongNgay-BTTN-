name: BTTN midday

on:
  schedule:
    # 12:00 Asia/Ho_Chi_Minh (UTC+7), Monday-Friday. GitHub may queue runs late.
    - cron: '0 5 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Chọn cách xuất bản tin Word'
        type: choice
        required: true
        default: '1. Gửi file Word đến các email'
        options:
          - '1. Gửi file Word đến các email'
          - '2. Chỉ tạo file Word'

permissions:
  contents: read

concurrency:
  group: bttn-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu libgl1
          echo 'ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true' | sudo debconf-set-selections
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y ttf-mscorefonts-installer
          fc-cache -f
          test "$(fc-match -f '%{family}' 'Times New Roman')" = 'Times New Roman'
          python -m pip install -r requirements.txt
          npm ci --ignore-scripts
      - name: Restore delivery ledger
        id: ledger
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: bttn-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bttn-ledger-
      - name: Collect, validate, render and publish
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TRADINGECONOMICS_API_KEY: ${{ secrets.TRADINGECONOMICS_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENTS: ${{ vars.RECIPIENTS || 'datnh1@mbbank.com.vn,trungnt@mbbank.com.vn,research.treasury@mbbank.com.vn' }}
          REPORT_ACTION: ${{ inputs.action || '1. Gửi file Word đến các email' }}
        run: |
          case "$REPORT_ACTION" in
            '1. Gửi file Word đến các email')
              python market_report.py --type midday --send
              ;;
            '2. Chỉ tạo file Word')
              python market_report.py --type midday --create-only
              ;;
            *)
              echo 'Lựa chọn xuất bản không hợp lệ' >&2
              exit 2
              ;;
          esac
      - name: Persist delivery ledger even after SMTP uncertainty
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: bttn-ledger-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTTN-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 7
          if-no-files-found: warn
