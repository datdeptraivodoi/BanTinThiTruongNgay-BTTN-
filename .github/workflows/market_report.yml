name: BTTN midday

on:
  schedule:
    # 12:00 Asia/Ho_Chi_Minh (UTC+7), Monday-Friday. GitHub may queue runs late.
    - cron: '0 5 * * 1-5'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Send after validation (otherwise preview only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bttn-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice fonts-dejavu fonts-liberation libgl1
          python -m pip install -r requirements-dev.txt
      - name: Regression tests
        run: python -m pytest -q
      - name: Restore delivery ledger
        id: ledger
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: bttn-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bttn-ledger-
      - name: Collect, validate, render and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPEN_ROUTER_API_KEY || secrets.Open_Router_API_Key || secrets.OPENROUTER_KEY || secrets.OPENROUTER_TOKEN || secrets.OPEN_ROUTER_KEY || secrets.OPEN_ROUTER_TOKEN }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY || secrets.OPENROUTER_API_KEY || secrets.Open_Router_API_Key || secrets.OPENROUTER_KEY || secrets.OPENROUTER_TOKEN }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'inclusionai/ling-3.0-flash-fin:free' }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENTS: ${{ vars.RECIPIENTS || 'datnh1@mbbank.com.vn,trungnt@mbbank.com.vn,research.treasury@mbbank.com.vn' }}
          SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email }}
        run: |
          if [ "$SEND_EMAIL" = "true" ]; then
            python market_report.py --type midday --send
          else
            python market_report.py --type midday --dry-run
          fi
      - name: Persist delivery ledger even after SMTP uncertainty
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: bttn-ledger-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTTN-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 7
          if-no-files-found: warn
